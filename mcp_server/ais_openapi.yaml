openapi: 3.1.0
info:
  title: AIS Agent API
  version: "1.0.0"
  description: |
    AIS (Automatic Identification System) agent for discovering vessels near a location
    or inside an Area of Interest (AOI), retrieving vessel profiles, most recent photo,
    and historical tracks. The spec is tuned for LLM tool-use and WatsonX Orchestrate.
  x-ibm-skill-headers:
    X-Session-Id: X-Session-Id
    
servers:
  - url: http://localhost:8200/mcp/ais
    description: MCP bridge to the local AIS agent (via mcp_server)

x-examples:
  vessel_sample: &id002
    mmsi: '366123456'
    imo: '9276650'
    name: PACIFIC VOYAGER
    call_sign: WDC9876
    flag: US
    type: tanker
    length_m: 250.0
    beam_m: 42.0
    draught_m: 12.1
    ais_class: A
    position:
      lat: 64.419998
      lon: -174.39166
      sog_knots: 12.3
      cog_deg: 277.4
      timestamp: '2025-10-13T14:02:11Z'

tags:
  - name: Vessels
    description: Vessel discovery and listings
  - name: Vessel
    description: Single vessel information and media
  - name: System
    description: Health and service ops
  - name: AOI
    description: Area of Interest registry and features
  - name: Events
    description: Vessel event listings
  - name: PortCalls
    description: Port call listings
  - name: Routing
    description: Routing and distance-to-port utilities

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health_health_get
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessels/nearby:
    get:
      tags: [Vessels]
      summary: Vessels Nearby
      description: |
        Return vessels within a specified **radius_nm** of a point (lat/lon), or within
        an AOI if `aoi_id` is provided. Time window can be constrained via `timespan`.
      operationId: vessels_nearby_vessels_nearby_get
      parameters:
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/radius_nm'
        - $ref: '#/components/parameters/aoi_id'
        - $ref: '#/components/parameters/timespan'
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A list of vessels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselList'
              examples:
                example:
                  value:
                    count: 1
                    vessels:
                      - *id002
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessels/aoi:
    get:
      tags: [Vessels]
      summary: Vessels in AOI
      description: |
        List vessels inside a named AOI (Area of Interest) or a bounding box (`bbox`).
        If both are provided, the AOI takes precedence.
      operationId: vessels_in_aoi_vessels_aoi_get
      parameters:
        - $ref: '#/components/parameters/aoi_id'
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Vessels currently inside the AOI or bbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselList'
              examples:
                example:
                  value:
                    count: 1
                    vessels:
                      - *id002
        '400':
          description: Invalid AOI or bbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessel/info:
    get:
      tags: [Vessel]
      summary: Vessel Info by MMSI or IMO
      description: Retrieve a vessel profile using either MMSI or IMO.
      operationId: vessel_info_vessel_info_get
      parameters:
        - $ref: '#/components/parameters/mmsi'
        - $ref: '#/components/parameters/imo'
      responses:
        '200':
          description: Vessel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
              examples:
                example:
                  value: *id002
        '404':
          description: Vessel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessel/photo:
    get:
      tags: [Vessel]
      summary: Latest vessel photo by MMSI or IMO
      description: Returns a URL to a recent vessel photo, if available.
      operationId: vessel_photo_vessel_photo_get
      parameters:
        - $ref: '#/components/parameters/mmsi'
        - $ref: '#/components/parameters/imo'
      responses:
        '200':
          description: Photo reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '404':
          description: No photo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessel/track:
    get:
      tags: [Vessel]
      summary: Vessel AIS track in a time window
      description: Retrieve AIS positions for a vessel between `start` and `end` (UTC).
      operationId: vessel_track_vessel_track_get
      parameters:
        - $ref: '#/components/parameters/mmsi'
        - $ref: '#/components/parameters/imo'
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Vessel positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselTrack'
        '400':
          description: Invalid parameters or time window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /aoi:
    get:
      tags: [AOI]
      summary: List AOIs
      description: |
        List registered Areas of Interest (AOIs) with basic metadata such as id,
        display name, type, and bounding box.
      operationId: aoi_list_aoi_get
      responses:
        '200':
          description: AOI listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        display_name:
                          type: string
                        type:
                          type: string
                          description: AOI type, e.g., bbox
                        bbox:
                          type: array
                          items:
                            type: number
                  meta:
                    type: object

  /aoi/{aoi_id}:
    get:
      tags: [AOI]
      summary: AOI detail
      description: Retrieve a single AOI feature and associated metadata.
      operationId: aoi_detail_aoi_aoi_id_get
      parameters:
        - name: aoi_id
          in: path
          required: true
          description: AOI identifier
          schema:
            type: string
      responses:
        '200':
          description: AOI feature
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    type: object
                  meta:
                    type: object
        '404':
          description: AOI not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessel/events:
    get:
      tags: [Events]
      summary: Vessel events
      description: |
        List vessel events for a single vessel (by ship_id, MMSI, or IMO) over
        a specified time window or timespan in minutes.
      operationId: vessel_events_vessel_events_get
      parameters:
        - $ref: '#/components/parameters/mmsi'
        - $ref: '#/components/parameters/imo'
        - name: ship_id
          in: query
          required: false
          description: Provider vessel id
          schema:
            type: string
        - name: fromdate
          in: query
          required: false
          description: UTC start time, e.g., 2025-09-01 00:00
          schema:
            type: string
        - name: todate
          in: query
          required: false
          description: UTC end time, e.g., 2025-09-02 00:00
          schema:
            type: string
        - name: timespan
          in: query
          required: false
          description: Maximum age, in minutes, of returned events (max 2880)
          schema:
            type: integer
      responses:
        '200':
          description: Vessel events
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vessel/portcalls:
    get:
      tags: [PortCalls]
      summary: Single vessel portcalls
      description: List portcalls for a single vessel over a specified time range or timespan.
      operationId: vessel_portcalls_vessel_portcalls_get
      parameters:
        - name: ship_id
          in: query
          required: false
          description: Provider vessel id
          schema:
            type: string
        - name: fromdate
          in: query
          required: false
          description: UTC start time, e.g., 2025-09-01 00:00
          schema:
            type: string
        - name: todate
          in: query
          required: false
          description: UTC end time, e.g., 2025-09-02 00:00
          schema:
            type: string
        - name: timespan
          in: query
          required: false
          description: Maximum age, in minutes, of returned port calls (max 2880)
          schema:
            type: integer
      responses:
        '200':
          description: Portcalls for a vessel
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /portcalls:
    get:
      tags: [PortCalls]
      summary: Portcalls for a port
      description: List portcalls for a given port (by id or UN/LOCODE) over a time range.
      operationId: portcalls_portcalls_get
      parameters:
        - name: port_id
          in: query
          required: false
          description: Port id or UN/LOCODE
          schema:
            type: string
        - name: fromdate
          in: query
          required: false
          description: UTC start time, e.g., 2025-09-01 00:00
          schema:
            type: string
        - name: todate
          in: query
          required: false
          description: UTC end time, e.g., 2025-09-02 00:00
          schema:
            type: string
        - name: timespan
          in: query
          required: false
          description: Maximum age, in minutes, of returned port calls (max 2880)
          schema:
            type: integer
      responses:
        '200':
          description: Portcalls for a port
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routing/distance_to_port:
    get:
      tags: [Routing]
      summary: Distance between ports
      description: |
        Compute a route and distance between a starting port and target port,
        identified by UN/LOCODE or provider port ids.
      operationId: routing_distance_to_port_get
      parameters:
        - name: start_port
          in: query
          required: false
          description: Starting port UN/LOCODE
          schema:
            type: string
        - name: end_port
          in: query
          required: false
          description: Ending port UN/LOCODE
          schema:
            type: string
      responses:
        '200':
          description: Routing information between ports
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routing/vessel_route_to_port:
    get:
      tags: [Routing]
      summary: Vessel route to port
      description: |
        Compute a potential route from a vessel (by ship_id, MMSI, or IMO) to a
        target port, identified by UN/LOCODE or provider port id.
      operationId: routing_vessel_route_to_port_get
      parameters:
        - name: ship_id
          in: query
          required: false
          description: Provider vessel id
          schema:
            type: string
        - $ref: '#/components/parameters/mmsi'
        - $ref: '#/components/parameters/imo'
        - name: port_id
          in: query
          required: false
          description: Target port UN/LOCODE
          schema:
            type: string
      responses:
        '200':
          description: Routing information from vessel to port
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    lat:
      name: lat
      in: query
      required: false
      description: Latitude in decimal degrees (-90..90)
      schema:
        type: number
        minimum: -90
        maximum: 90
    lon:
      name: lon
      in: query
      required: false
      description: Longitude in decimal degrees (-180..180)
      schema:
        type: number
        minimum: -180
        maximum: 180
    radius_nm:
      name: radius_nm
      in: query
      required: true
      schema:
        type: number
        minimum: 0.1
        maximum: 540
        default: 30
      description: Search radius in nautical miles
    aoi_id:
      name: aoi_id
      in: query
      required: false
      schema:
        type: string
      description: Area of Interest identifier
    bbox:
      name: bbox
      in: query
      required: false
      description: Bounding box in minLon,minLat,maxLon,maxLat
      schema:
        type: string
        example: "-170.0,64.0,-160.0,66.0"
    timespan:
      name: timespan
      in: query
      required: false
      description: ISO-8601 duration or preset (e.g., P1D, P2D, PT12H)
      schema:
        type: string
        example: P2D
    type:
      name: type
      in: query
      required: false
      description: Vessel type filter (e.g., tanker, cargo, fishing)
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Max results to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    mmsi:
      name: mmsi
      in: query
      required: false
      schema:
        type: string
        pattern: '^[0-9]{9}$'
      description: Nine-digit Maritime Mobile Service Identity
    imo:
      name: imo
      in: query
      required: false
      schema:
        type: string
        pattern: '^[0-9]{7}$'
      description: Seven-digit IMO number (no check digit)
    start:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Start time (UTC, ISO-8601)
    end:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: End time (UTC, ISO-8601)

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime_s:
          type: number
          example: 12345.6
      required: [status]

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
      required: [error, message]

    VesselPosition:
      type: object
      properties:
        lat:
          type: number
        lon:
          type: number
        sog_knots:
          type: number
        cog_deg:
          type: number
        timestamp:
          type: string
          format: date-time

    Vessel:
      type: object
      properties:
        mmsi:
          type: string
        imo:
          type: string
        name:
          type: string
        call_sign:
          type: string
        flag:
          type: string
        type:
          type: string
        length_m:
          type: number
        beam_m:
          type: number
        draught_m:
          type: number
        ais_class:
          type: string
        position:
          $ref: '#/components/schemas/VesselPosition'

    VesselList:
      type: object
      properties:
        count:
          type: integer
        vessels:
          type: array
          items:
            $ref: '#/components/schemas/Vessel'
      required: [count, vessels]

    VesselTrack:
      type: object
      properties:
        mmsi:
          type: string
        imo:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/VesselPosition'
      required: [points]

    PhotoResponse:
      type: object
      properties:
        mmsi:
          type: string
        imo:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
      required: [url]

x-llm-usage:
  guidance:
    selection: |
      Choose the most specific endpoint. Use /vessel/info when you have an MMSI or IMO.
      Use /vessels/nearby for proximity queries. Use /vessels/aoi for AOI-restricted queries.
    geo: |
      Validate lat/lon ranges. Distances default to nautical miles.
  canonical_examples:
    - goal: Find tanker vessels within 30 nm of a point and list top 5 by length.
      calls:
        - operationId: vessels_nearby_vessels_nearby_get
          params:
            lat: 64.42
            lon: -174.39
            radius_nm: 30
            type: tanker
            limit: 50
        - operationId: vessels_nearby_sort_local
          note: Sort by length_m descending client-side and return top 5 names + MMSI.
    - goal: "Get a vessel’s profile and latest photo by MMSI."
      calls:
        - operationId: vessel_info_vessel_info_get
          params: { mmsi: '366123456' }
        - operationId: vessel_photo_vessel_photo_get
          params: { mmsi: '366123456' }
    - goal: List vessels currently inside a named AOI.
      calls:
        - operationId: vessels_in_aoi_vessels_aoi_get
          params: { aoi_id: bering_sea_ops }
    - goal: "Retrieve a vessel’s track for a specific UTC window."
      calls:
        - operationId: vessel_track_vessel_track_get
          params:
            mmsi: '366123456'
            start: '2025-10-10T00:00:00Z'
            end: '2025-10-13T23:59:59Z'


