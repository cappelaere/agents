openapi: 3.1.0
info:
  title: Arctic Map Agent (Leaflet) API
  version: 1.0.0
  description: |
    API for a lightweight “map agent” that displays **GeoJSON** on a Leaflet web page.

    ## What this service does
    - `POST /ingest` accepts **GeoJSON** and immediately pushes it to all connected browsers via WebSocket, updating the live map.
    - `GET /` serves the web UI (Leaflet map pre-centered on the Arctic).
    - `GET /health` is a simple liveness probe.
    - `GET /version` reports build metadata.
    - `WS /ws` is the WebSocket endpoint the page uses to receive live GeoJSON updates (documented here for awareness).

    ## Guidance for LLMs and tool callers
    - **Primary action**: Use `POST /ingest` to display things on the map.
    - **Payload format**: Send valid **GeoJSON** in **WGS-84** (`[longitude, latitude]`) coordinates.
      - Preferred: a `FeatureCollection` containing one or more `Feature` objects.
      - Also accepted: a single `Feature` or bare Geometry (`Point`, `LineString`, `Polygon`, etc.).
    - The service validates the payload against a GeoJSON schema and rejects invalid requests with a helpful error message.
    - The browser client auto-zooms to the dataset’s bounding box when there are features.

servers:
  - url: http://150.240.3.116:8120
    description: Production server

tags:
  - name: Ingest
    description: Send GeoJSON for immediate display on the live map
  - name: Health
    description: Liveness and basic status
  - name: UI
    description: Browser map application
  - name: Meta
    description: Version/build metadata
  - name: Realtime
    description: WebSocket used by the UI to receive updates (documented for awareness)

paths:
  /ingest:
    post:
      tags: [Ingest]
      summary: Ingest GeoJSON and broadcast to the live Leaflet map
      operationId: ingestGeoJSON
      description: |
        Accepts **GeoJSON** and broadcasts it to all connected web clients.
        The browser’s map immediately updates to show the provided data.

        ## LLM / tool usage

        - Send a JSON object with a single field: `geojson`.
        - `geojson` MUST be a valid GeoJSON object:
          - Prefer a `FeatureCollection` with one or more `Feature`s.
          - A single `Feature` or bare Geometry is also accepted.
        - Do **not** send YAML or plain text; send pure JSON only.

        Example request body:

        ```json
        {
          "geojson": {
            "type": "FeatureCollection",
            "features": [
              {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [-150, 75] },
                "properties": { "name": "Vessel A", "mmsi": "123" }
              }
            ]
          }
        }
        ```

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoJSONIngestRequest'
            examples:
              vesselsAndAOI:
                summary: Two vessels and an AOI polygon (wrapped)
                value:
                  geojson:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        geometry:
                          type: Point
                          coordinates: [-150, 75]
                        properties:
                          name: Vessel A
                          mmsi: "123"
                      - type: Feature
                        geometry:
                          type: Point
                          coordinates: [-160, 78]
                        properties:
                          name: Vessel B
                          mmsi: "456"
                      - type: Feature
                        geometry:
                          type: Polygon
                          coordinates:
                            - [[-170, 72], [-160, 72], [-160, 74], [-170, 74], [-170, 72]]
                        properties:
                          name: AOI
      responses:
        '200':
          description: GeoJSON accepted and broadcast to all clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  features:
                    type: integer
                    nullable: true
                    description: Number of features in the ingested FeatureCollection (if any).
        '400':
          description: Invalid JSON or GeoJSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidJson:
                  summary: Malformed JSON
                  value:
                    error: "Invalid JSON: Expecting value: line 1 column 1 (char 0)"
                invalidGeojson:
                  summary: Schema validation error
                  value:
                    error: "Invalid GeoJSON: missing 'type'"

  /:
    get:
      tags: [UI]
      summary: Map UI
      operationId: getMapUi
      description: |
        Serves the Leaflet web application. The page:
        - Connects to `WS /ws` to receive live updates.
        - Starts with an Arctic-centered view.
        - Renders the most recently ingested GeoJSON.
      responses:
        '200':
          description: HTML map page
          content:
            text/html:
              schema:
                type: string

  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /version:
    get:
      tags: [Meta]
      summary: Version/build metadata
      operationId: version
      responses:
        '200':
          description: Build info (if available)
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                    example: Arctic Map Agent (Leaflet)
                  version:
                    type: string
                    example: "0.1.0"
                  git_sha:
                    type: string
                    example: "abc1234"
                  build_time:
                    type: string
                    example: "2025-10-17T19:00:00Z"

  /ws:
    get:
      tags: [Realtime]
      summary: WebSocket endpoint (used by the UI)
      operationId: websocket
      description: |
        **WebSocket** used by the browser to receive live GeoJSON.

        - The server may send periodic keep-alive frames like `{"type":"ping"}`; clients should ignore these for rendering.
        - When valid GeoJSON arrives (FeatureCollection/Feature/Geometry), the UI replaces the current dataset and re-renders.

        > Note: OpenAPI formally documents HTTP endpoints; this WebSocket path is included **for awareness** only.
      responses:
        '101':
          description: Protocol switch to WebSocket

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    FeatureCollection:
      type: object
      description: |
        A GeoJSON FeatureCollection. Prefer this shape for map updates.
        The client auto-zooms to the bbox when at least one feature is present.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'

    Feature:
      type: object
      required: [type, geometry]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          description: Arbitrary key/value attributes shown in popups on the map.

    Geometry:
      description: Any non-collection GeoJSON geometry.
      oneOf:
        - $ref: '#/components/schemas/Point'
        - $ref: '#/components/schemas/MultiPoint'
        - $ref: '#/components/schemas/LineString'
        - $ref: '#/components/schemas/MultiLineString'
        - $ref: '#/components/schemas/Polygon'
        - $ref: '#/components/schemas/MultiPolygon'

    Point:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          $ref: '#/components/schemas/Position'

    MultiPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiPoint]
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    LineString:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          $ref: '#/components/schemas/LineStringCoords'

    MultiLineString:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiLineString]
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/LineStringCoords'

    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          $ref: '#/components/schemas/PolygonCoords'

    MultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiPolygon]
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/PolygonCoords'

    Position:
      type: array
      description: >
        WGS-84 position as [longitude, latitude] or [longitude, latitude, elevation].
      items:
        type: number
      minItems: 2
      maxItems: 3
      example: [-150.0, 75.0]

    LineStringCoords:
      type: array
      description: An array of Positions with at least two points.
      items:
        $ref: '#/components/schemas/Position'
      minItems: 2

    PolygonCoords:
      type: array
      description: |
        An array of LinearRings. Each LinearRing is an array of Positions
        where the first and last positions are equivalent (closed).
      items:
        type: array
        items:
          $ref: '#/components/schemas/Position'
        minItems: 4
      minItems: 1

    GeoJSONAny:
      description: |
        Any valid GeoJSON object that this service can display.
        Use FeatureCollection when possible; Feature or Geometry are also accepted.
      oneOf:
        - $ref: '#/components/schemas/FeatureCollection'
        - $ref: '#/components/schemas/Feature'
        - $ref: '#/components/schemas/Geometry'

    GeoJSONIngestRequest:
      type: object
      description: |
        Request body for `/ingest` when called by an assistant or tool.

        The `geojson` field MUST contain the full GeoJSON object to display.
        Do not wrap the GeoJSON in other fields besides `geojson`.
      required: [geojson]
      properties:
        geojson:
          description: Raw GeoJSON to display on the map.
          $ref: '#/components/schemas/GeoJSONAny'

x-codeSamples:
  - lang: Bash (curl)
    label: Ingest wrapped GeoJSON via /ingest
    source: |
      curl -X POST http://localhost:8200/ingest \
        -H 'Content-Type: application/json' \
        -d '{
          "geojson": {
            "type": "FeatureCollection",
            "features": [
              {
                "type": "Feature",
                "geometry": { "type": "Point", "coordinates": [-150, 75] },
                "properties": { "name": "Vessel A", "mmsi": "123" }
              }
            ]
          }
        }'
  - lang: PowerShell
    label: Ingest wrapped GeoJSON via /ingest (PowerShell)
    source: |
      $body = @{
        geojson = @{
          type = "FeatureCollection"
          features = @(
            @{
              type = "Feature"
              geometry = @{ type = "Point"; coordinates = @(-150, 75) }
              properties = @{ name = "Vessel A"; mmsi = "123" }
            }
          )
        }
      } | ConvertTo-Json -Depth 5

      Invoke-WebRequest -Uri http://localhost:8200/ingest `
        -Method Post `
        -ContentType 'application/json' `
        -Body $body
