
services:
  metoc_agent:
    build:
      context: ./agents/metoc_agent
    image: metoc_agent:latest
    container_name: metoc_agent
    ports:
      - "8080:8080"
    env_file: ./.env
    volumes:
      - ./agents/metoc_agent:/app


  seaice_agent:
    build:
      context: ./agents/seaice_agent
    image: seaice_agent:latest
    container_name: seaice_agent
    ports:
      - "8090:8090"
    env_file: ./.env
    volumes:
      - ./agents/seaice_agent:/app
      - /home/vpcuser/agents/data:/home/vpcuser/agents/data

  ais_agent:
    build:
      context: ./agents/ais_agent
    image: ais_agent:latest
    container_name: ais_agent
    ports:
      - "8100:8100"
    env_file: ./.env
    volumes:
      - ./agents/ais_agent:/app


  ports_agent:
    build:
      context: ./agents/ports_agent
    image: ports_agent:latest
    container_name: ports_agent
    ports:
      - "8110:8110"
    env_file: ./.env
    volumes:
      - ./agents/ports_agent:/app
    
  map_agent:
    build:
      context: ./agents/map_agent
    image: map_agent:latest
    container_name: map_agent
    ports:
      - "8120:8120"
    env_file: ./.env
    volumes:
      - ./agents/map_agent:/app

  mcp_server:
    build:
      context: ./mcp_server
    image: mcp_server:latest
    container_name: mcp_server
    ports:
      - "8200:8200"
    env_file: ./.env
    volumes:
      # Mount the local mcp_server source into the container for live reload
      - ./mcp_server:/app

secrets:
  env:
    file: ./.env

volumes:
  pgdata:
  clickhouse_data:
